name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build e deploy ficam em jobs separados de propósito.
# Só o job de deploy declara `environment: github-pages`, e o GitHub avalia essa
# proteção ANTES de alocar runner: se o Pages não estiver com "GitHub Actions"
# como origem (ou o ambiente barrar a branch), o job morre em segundos, sem log
# nenhum — foi o que aconteceu nas 17 execuções anteriores. Com os jobs
# separados, o `configure-pages` roda de verdade (é ele que corrige a origem do
# Pages) e qualquer falha restante aparece no passo certo, com log.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages (habilita e aponta para GitHub Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
